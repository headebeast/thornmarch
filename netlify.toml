# Static hosting on Netlify: every single-player mode works as-is (Battle Royale vs bots, Frontier, Skirmish, Campaign, editor).
# Online rooms need the Node game server (see DEPLOY.md) — until one is running, online play is switched off here.
#   When it is up: set SERVER_URL below to its wss:// address, change ONLINE to "on", and redeploy.
[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"
  SITE_URL = "https://thornmarch.netlify.app"
  SOURCE_URL = "https://github.com/headebeast/thornmarch"
  ONLINE = "off"
  SERVER_URL = ""
  ANALYTICS_URL = "/api"
  # Secrets are NOT stored here. Set in Netlify (Site configuration → Environment variables) or with `netlify env:set`:
  #   ANALYTICS_TOKEN  the dashboard key (required to read /admin)
  #   ANALYTICS_SALT   any random text (scrambles stored address hashes)
  #   ANALYTICS_FULL_IP=1  (optional) keep whole IP addresses instead of masked ones
